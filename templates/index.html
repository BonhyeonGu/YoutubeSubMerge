<!DOCTYPE html>
<html lang="kr">
<head>
<meta charset="UTF-8">
<title>Subsc</title>
<style>
/* 기존 스타일 유지 */
</style>
</head>
<body>

<h1>Subsc</h1>

<div class="container">
    <div class="total-storage" id="total-storage">총 소비 용량: 계산 중...</div>

    <!-- 모드 선택 -->
    <div style="margin-bottom: 10px;">
        <label><input type="radio" name="mode" value="url" checked> URL로 다운로드</label>
        <label><input type="radio" name="mode" value="upload"> 파일 업로드</label>
    </div>

    <div class="control-panel">
        <input type="text" id="video-url" placeholder="Video Download URL">
        <input type="file" id="video-file" style="display: none;">
        <input type="text" id="video-id" placeholder="Video ID">
        <select id="language">
            <option value="ko">Korean</option>
            <option value="en">English</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
        </select>
        <button id="subscribe-btn">변환</button>
    </div>

    <button id="refresh-list" style="margin-bottom: 20px;">목록 새로고침</button>

    <div id="status-message"></div>
    <div id="files-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
function formatBytes(bytes, decimals = 2) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const dm = decimals < 0 ? 0 : decimals;
    const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
}

function formatGigabytes(bytes) {
    const gb = bytes / (1024 ** 3);
    return `${gb.toFixed(2)} GB`;
}

function shortenText(text, maxLength = 30) {
    return text.length > maxLength ? text.slice(0, maxLength) + '...' : text;
}

async function fetchAndDisplayList() {
    const response = await axios.get('/getremotelist');
    const filesList = document.getElementById('files-list');
    filesList.innerHTML = '';
    let totalSize = 0;

    const sortedFiles = response.data.sort((a, b) => {
        const aDate = parseInt(a.split(', ')[2].split(': ')[1]);
        const bDate = parseInt(b.split(', ')[2].split(': ')[1]);
        return bDate - aDate;
    });

    const filePromises = sortedFiles.map(async file => {
        const parts = file.split(', ');
        const videoId = parts[0].split(': ')[1].replace('.mp4', '');
        const size = parseInt(parts[1].split(': ')[1]);
        totalSize += size;

        let title = videoId;
        let thumbnailUrl = `https://img.youtube.com/vi/${videoId}/default.jpg`;

        try {
            const videoResponse = await axios.get('https://noembed.com/embed', { params: { url: `https://www.youtube.com/watch?v=${videoId}` } });
            title = shortenText(videoResponse.data.title);
            thumbnailUrl = videoResponse.data.thumbnail_url;
        } catch (error) {
            console.warn('Could not fetch video info for:', videoId);
        }

        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
            <img src="${thumbnailUrl}">
            <div class="file-details">${title} - ${formatBytes(size)}</div>
            <div class="file-actions">
                <button onclick="navigator.clipboard.writeText('https://vrcimg.hatsune.app/subsc/${videoId}.mp4')">복사</button>
                <button onclick="confirmDelete('${videoId}')">삭제</button>
            </div>
        `;

        return item;
    });

    const items = await Promise.all(filePromises);
    items.forEach(item => filesList.appendChild(item));
    document.getElementById('total-storage').textContent = `총 소비 용량: ${formatGigabytes(totalSize)}`;
}

function confirmDelete(videoId) {
    if (confirm(`${videoId}을(를) 삭제하시겠습니까?`)) {
        axios.post('/deleteremote', { videoId }).then(() => fetchAndDisplayList());
    }
}

document.querySelectorAll('input[name="mode"]').forEach(el => {
    el.addEventListener('change', e => {
        const mode = e.target.value;
        document.getElementById('video-url').style.display = mode === 'url' ? 'block' : 'none';
        document.getElementById('video-file').style.display = mode === 'upload' ? 'block' : 'none';
    });
});

document.getElementById('refresh-list').addEventListener('click', fetchAndDisplayList);

document.getElementById('subscribe-btn').addEventListener('click', () => {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const videoId = document.getElementById('video-id').value;
    const language = document.getElementById('language').value;

    if (mode === 'url') {
        const videoUrl = document.getElementById('video-url').value;
        axios.post('/subsc', { url: videoUrl, id: videoId, language }).then(() => fetchAndDisplayList());
    } else {
        const fileInput = document.getElementById('video-file');
        const file = fileInput.files[0];
        if (!file) return alert('파일을 선택하세요.');
        const formData = new FormData();
        formData.append('file', file);
        formData.append('id', videoId);
        formData.append('language', language);

        axios.post('/upload', formData, {
            headers: { 'Content-Type': 'multipart/form-data' }
        }).then(() => fetchAndDisplayList());
    }
});

fetchAndDisplayList();
</script>
</body>
</html>
