<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <title>Youtube Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
            color: #444;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .total-storage {
            text-align: right;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .status-message {
            text-align: center;
            font-weight: bold;
            margin: 10px 0;
            color: #555;
        }

        .control-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], select {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .file-item img {
            width: 50px;
            height: 50px;
            border-radius: 5px;
        }

        .file-details {
            display: flex;
            flex-grow: 1;
            flex-direction: column;
            margin-left: 10px;
            min-width: 0;
        }

        .file-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex: 1 1 auto;
            font-weight: bold;
        }

        .file-actions button {
            margin-left: 10px;
        }

        .status-message.loading {
            color: #555;
        }

        .status-message.success {
            color: green;
        }

        .status-message.error {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Youtube Downloader</h1>

    <div class="container">
        <div class="total-storage" id="total-storage">총 소비 용량: 계산 중...</div>

        <div class="control-panel">
            <input type="text" id="video-url" placeholder="Video Download URL">
            <input type="text" id="video-id" placeholder="Video ID">
            <select id="language">
                <option value="ko">Korean</option>
                <option value="en">English</option>
                <option value="ja">Japanese</option>
                <option value="zh">Chinese</option>
            </select>
            <button id="subscribe-btn">변환</button>
        </div>

        <div class="status-message" id="status-message"></div>

        <button id="refresh-list" style="margin-bottom: 20px;">목록 새로고침</button>

        <div id="files-list"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        function setStatusMessage(message, type = 'loading') {
            const statusMessage = document.getElementById('status-message');
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
        }

        function shortenText(text, maxLength = 20) {
            return text.length > maxLength ? text.slice(0, maxLength) + '...' : text;
        }

        async function fetchAndDisplayList() {
            setStatusMessage('🔄 목록을 불러오는 중...');
            const response = await axios.get('/getremotelist');
            const filesList = document.getElementById('files-list');
            filesList.innerHTML = '';
            let totalSize = 0;

            const filePromises = response.data.map(async file => {
                const parts = file.split(', ');
                const videoId = parts[0].split(': ')[1].replace('.mp4', '').trim();
                const size = parseInt(parts[1].split(': ')[1]);
                totalSize += size;

                let title = videoId;
                let thumbnailUrl = `https://img.youtube.com/vi/${videoId}/default.jpg`;

                try {
                    const videoResponse = await axios.get('https://noembed.com/embed', { params: { url: `https://www.youtube.com/watch?v=${videoId}` } });
                    title = shortenText(videoResponse.data.title, 20);
                    thumbnailUrl = videoResponse.data.thumbnail_url;
                } catch (error) {
                    console.warn('Could not fetch video info for:', videoId);
                }

                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <img src="${thumbnailUrl}">
                    <div class="file-details">
                        <div class="file-title">${title}</div>
                    </div>
                    <div class="file-actions">
                        <button onclick="navigator.clipboard.writeText('https://vrcimg.9bon.org/subsc/${videoId}.mp4')">복사</button>
                        <button onclick="confirmDelete('${videoId}')">삭제</button>
                    </div>
                `;

                return item;
            });

            const items = await Promise.all(filePromises);
            items.forEach(item => filesList.appendChild(item));
            document.getElementById('total-storage').textContent = `총 소비 용량: ${(totalSize / (1024 ** 3)).toFixed(2)} GB`;
            setStatusMessage('');
        }

        function confirmDelete(videoId) {
            if (confirm(`${videoId}을(를) 삭제하시겠습니까?`)) {
                setStatusMessage('🔄 파일을 삭제하는 중...', 'loading');
                axios.post('/deleteremote', { videoId }).then(() => fetchAndDisplayList());
            }
        }

        document.getElementById('refresh-list').addEventListener('click', fetchAndDisplayList);
        document.getElementById('subscribe-btn').addEventListener('click', async () => {
            setStatusMessage('🔄 진행 중...');
            await axios.post('/subsc');
            setStatusMessage('✅ 완료!', 'success');
            fetchAndDisplayList();
        });

        fetchAndDisplayList();
    </script>

</body>
</html>
